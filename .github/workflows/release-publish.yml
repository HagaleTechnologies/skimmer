name: Release Publish

# MAN-21: the actual publish path -- pushes the multi-arch Docker image
# to GHCR and creates the GitHub Release, from a tagged commit.
#
# Deliberately a SEPARATE FILE from release.yml, not a job within it, and
# deliberately has NO `pull_request` trigger anywhere in its `on:` block
# (PR #78 review round 6). Splitting into a second job within the same
# file (the previous approach) is not sufficient on its own: for a
# `pull_request` event, GitHub evaluates the ENTIRE workflow file --
# every job, every `if:`, every `permissions:` block -- from the PR's OWN
# head ref, not the base branch (this is exactly why `pull_request_target`
# exists as the alternative; see wait-for-codex.yml's own header comment
# for this repo's established precedent on the same class of risk). A
# same-repository PR (not subject to the read-only-token restriction that
# only applies to FORK PRs) could therefore edit a job's `if:` condition
# within its own diff and have that edited condition evaluate true for
# its own run, reaching `packages: write` before the PR is ever reviewed.
#
# Keeping the write-capable jobs in a file whose `on:` block never
# includes `pull_request` at all closes the straightforward/accidental
# version of this: today, nothing about a normal PR's `pull_request`
# event can invoke this file, because GitHub only evaluates a workflow
# file's jobs for event types that file's OWN `on:` block declares.
#
# MAN-244 requires owner-only release tags and owner deployment review. Before
# merging/using this workflow, protect both environments as documented in
# docs/RUNBOOKS/release.md. ghcr-publish permits only v* tags; ghcr-test-publish
# permits any ref but requires approval even for manual dry builds. The owner
# reviews this policy change to MAN-66's earlier no-reviewer disposition.
#
# MAN-66's residual credential risk remains accepted (Tony, 2026-09-12): a
# write-capable contributor can introduce a workflow that omits these gates and
# explicitly requests packages: write on GITHUB_TOKEN. Repository default token
# permissions are a fallback, not a ceiling. Moving the publishing credential
# and auditing organization-wide app permissions remain outside this change.
# A tag also runs the workflow at its own commit, so the owner must select a
# reviewed default-branch commit containing the ancestry guard below.

on:
  push:
    tags:
      # MAN-65: 'v*' also matched non-release tags (e.g. `vendor-freeze`),
      # each of which used to spend five platform builds just to fail. The
      # glob language can't express SemVer, so it only filters the obvious
      # non-releases; validate-tag below gives the explicit, readable
      # failure for near-misses (v1.2.3+linux and friends) -- a near-miss
      # must FAIL loudly, not be silently ignored.
      - 'v[0-9]*'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Push the Docker image to GHCR (never creates a GitHub Release -- that only ever happens from a real v* tag push)'
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always
  BIN_NAME: manta

concurrency:
  # Deliberately per-ref, NOT repo-wide: each release genuinely is
  # independent work that must not cancel another release's build. The
  # `:latest` write is the one thing that DOES need repo-wide correctness,
  # but NOT via a wider concurrency group here -- see `publish-latest`
  # below (deliberately no concurrency group of its own at all) and MAN-65's
  # decision doc, Finding 3, for why a repo-wide group was tried and
  # reverted: it would let a middle release's ENTIRE build get silently
  # cancelled, not just its `:latest` write, and cancellation order doesn't
  # even track tag-version order. `publish-latest` gets correctness instead
  # from answering a global "what's newest right now" question on every
  # run, independent of which run executes or finishes first.
  group: release-publish-${{ github.event_name == 'push' && github.ref || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # MAN-65 finding 1: fail an unpublishable tag in SECONDS, before five
  # platform builds burn -- and before Buildx rejects it 30 minutes in.
  # This job is also now the single place the version and image name are
  # derived; `build` and both Docker jobs consume its outputs instead of
  # each re-deriving them.
  validate-tag:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      image: ${{ steps.v.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: v
        shell: bash
        run: |
          set -euo pipefail
          # Gated on the EVENT being a real push, not merely on
          # github.ref_type == 'tag' -- ref_type is ALSO 'tag' for
          # `gh workflow run release-publish.yml --ref <existing-tag>
          # -f publish=true`, a workflow_dispatch run targeting an
          # existing tag, not a push.
          if [[ "${{ github.event_name }}" == "push" ]]; then
            VERSION="$(scripts/release-version.sh validate "$GITHUB_REF_NAME")"
          else
            VERSION="dispatch-${{ github.run_id }}"
            scripts/release-version.sh assert-oci-tag "$VERSION"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # OCI/Docker repository paths must be lowercase; github.repository
          # is case-preserving ("HagaleTechnologies/manta") and buildx
          # rejects a mixed-case tag outright.
          echo "image=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Require release commit on the default branch
        if: github.event_name == 'push'
        shell: bash
        env:
          RELEASE_COMMIT: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: scripts/check-release-ancestry.sh "$RELEASE_COMMIT" "$DEFAULT_BRANCH"

  build:
    needs: validate-tag
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-15-intel
            artifact: manta-macos-x86_64
          - target: aarch64-apple-darwin
            os: macos-14
            artifact: manta-macos-arm64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: manta-windows-x86_64
            exe_ext: .exe
            # MAN-65 finding 2: x86_64-pc-windows-msvc links the MSVC C
            # runtime DYNAMICALLY by default, so manta.exe cannot start on
            # a clean Windows install that has never had the Visual C++
            # 2015-2022 Redistributable -- and this ZIP ships only
            # manta.exe, README.md and the licences, nothing that would fix
            # that. Static CRT rather than bundling Microsoft's
            # redistributable installer: bundling adds a redistribution
            # question and an install step to the one path whose entire
            # point is unpack-and-run. Safe for this dependency graph:
            # `cargo build -p manta-cli` compiles no C code on Windows (the
            # only cc-using crate in Cargo.lock, `alloca`, is reachable
            # only through criterion, a dev-dependency), and Windows
            # platform access goes through windows-sys import libraries
            # against system DLLs.
            #
            # Set as a per-matrix-entry RUSTFLAGS rather than
            # .cargo/config.toml: a repo-wide cargo config file changes
            # every contributor's local Windows build by default, which is
            # a bigger blast radius than this fix needs, and this way the
            # flag is visibly scoped to exactly the one target it's for.
            # The trade-off, accepted: a contributor building locally on
            # Windows does not get the static CRT automatically and would
            # need to set this RUSTFLAGS themselves. The "Assert the
            # Windows binary is statically CRT-linked" step below is what
            # keeps this true in CI regardless.
            rustflags: '-C target-feature=+crt-static'
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: manta-linux-x86_64
            use_cross: true
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: manta-linux-arm64
            use_cross: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - if: runner.os == 'Linux' && !matrix.use_cross
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: ${{ matrix.target }}

      # MAN-243: no build cache, on purpose. A restored entry carries target/ objects and
      # ~/.cargo/bin + .crates.toml (rust-cache's paths) from whichever run wrote it -- including a
      # `cross` that `cargo install cross --version 0.2.5 --locked` below would then treat as already
      # installed. Release artifacts are built from the tagged tree and a fresh toolchain only; the
      # extra build time is accepted. See docs/DECISIONS/2026-10-10-man243-ci-trust-boundary.md.

      - name: Install cross
        if: matrix.use_cross
        run: cargo install cross --version 0.2.5 --locked

      - name: Build (native)
        if: "!matrix.use_cross"
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: cargo build --release -p manta-cli --features hpsdr --target ${{ matrix.target }}

      - name: Build (cross)
        if: matrix.use_cross
        run: cross build --release -p manta-cli --features hpsdr --target ${{ matrix.target }}

      # MAN-65 finding 2 (PR #78 review): on a clean Windows install without
      # the VC++ 2015-2022 Redistributable, a dynamically-CRT-linked
      # manta.exe cannot start -- and this ZIP contains only the exe, the
      # README and the licences, contradicting README's unpack-and-run
      # install path. The matrix's `rustflags` entry above links the CRT
      # statically for this target; this step is what keeps that true,
      # since nothing else in CI would notice if the flag were dropped or
      # overridden by a RUSTFLAGS environment variable.
      #
      # Substring scan of the raw bytes rather than `dumpbin /dependents`:
      # dumpbin needs the VS developer environment imported (an extra
      # third-party action to pin and audit), while PE import-table DLL
      # names are stored as plain ASCII, so their ABSENCE is conclusive.
      # The KERNEL32 assertion below is what makes that argument valid --
      # it proves the scan can see import names at all, so "no
      # VCRUNTIME140" means "not imported" rather than "scan looked at the
      # wrong thing".
      - name: Assert the Windows binary is statically CRT-linked
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = "target/${{ matrix.target }}/release/${env:BIN_NAME}${{ matrix.exe_ext }}"
          $ascii = [System.Text.Encoding]::ASCII.GetString([System.IO.File]::ReadAllBytes($exe))
          if ($ascii -notmatch 'KERNEL32\.dll') {
            Write-Error "import-name scan found no KERNEL32.dll -- the scan itself is broken, not the binary"
            exit 1
          }
          foreach ($dll in @('VCRUNTIME140', 'MSVCP140', 'api-ms-win-crt-')) {
            if ($ascii -match [regex]::Escape($dll)) {
              Write-Error "$exe imports $dll -- the dynamic MSVC runtime is back (MAN-65 finding 2). Check the release matrix's Windows rustflags entry and any RUSTFLAGS override."
              exit 1
            }
          }
          Write-Host "OK: no dynamic MSVC CRT imports."

      # MAN-268: one helper and one asset list for tar.gz and zip alike -- the binary, README,
      # licences, example config and service kit (scripts/tests/test_package_release.py runs this
      # step's body). Git Bash on Windows, where the interpreter is `python`, not `python3`.
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          format=tar.gz
          py=python3
          if [ "${{ runner.os }}" = "Windows" ]; then
            format=zip
            py=python
          fi
          "$py" scripts/package-release.py \
            --binary "target/${{ matrix.target }}/release/${BIN_NAME}${{ matrix.exe_ext }}" \
            --artifact "${{ matrix.artifact }}" \
            --format "$format" \
            --out-dir .

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.tar.gz
            ${{ matrix.artifact }}.zip
          if-no-files-found: ignore
          retention-days: 14

  # Separate environments preserve production's tag-only policy while allowing
  # deliberate manual builds on branches or tags. Both require owner approval;
  # naming the environments here does not configure their protection rules.
  # `release` (MAN-298) also runs in ghcr-publish, beside this job.
  docker-publish-release:
    needs: [validate-tag, build]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # MAN-244: owner approval and the v* tag policy, configured before use.
    # The header records the residual risk if another workflow omits this gate.
    environment: ghcr-publish
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          # The version tag only. `:latest` is no longer written HERE at all
          # (MAN-65 finding 3) -- see `publish-latest` below. Version and image
          # come from `validate-tag`, the one place they are derived (MAN-65
          # finding 1).
          tags: ${{ needs.validate-tag.outputs.image }}:${{ needs.validate-tag.outputs.version }}

      # MAN-65 finding 4 (remediate round 7, finding 3.B): this used to be
      # the last step of `publish-latest`, gated on
      # `steps.recency.outputs.newest == 'true'` -- but `is-newest-stable`
      # returns `false` for EVERY pre-release by design, so the very first
      # tag a maintainer plausibly pushes (`v0.1.0-rc.1`) skipped this
      # probe entirely, on exactly the publish that first creates the
      # private GHCR package. Visibility is a property of THIS PUSH, not
      # of the `:latest` decision, so it belongs here, gated on the same
      # condition that gates the push above -- and this is also where
      # `version` already lives, with no cross-job output needed.
      #
      # Never fails the job: the release itself is fine, and the fix is an
      # out-of-band human action. A hard failure here would report a
      # successful release as broken.
      #
      # Gated on success(), NOT always() (MAN-65 remediate round, CR-2):
      # always() also runs this probe when the preceding build-push step
      # itself failed or was cancelled, so a failed push (registry 5xx, an
      # arm64 compile error) would 404 the anonymous pull and report it as
      # a GHCR-visibility problem -- sending the maintainer to change a
      # package setting that isn't the actual failure. success() only
      # allows the probe to run when nothing earlier in the job has failed.
      - name: Verify the image is anonymously pullable
        if: success()
        env:
          IMAGE_PATH: ${{ github.repository }}
          VERSION: ${{ needs.validate-tag.outputs.version }}
        run: |
          set -uo pipefail
          REPO_LC="$(echo "$IMAGE_PATH" | tr '[:upper:]' '[:lower:]')"
          TOKEN="$(curl -fsSL "https://ghcr.io/token?scope=repository:${REPO_LC}:pull&service=ghcr.io" | jq -r .token || true)"
          CODE="$(curl -sSL -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${TOKEN:-}" \
            -H 'Accept: application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json' \
            "https://ghcr.io/v2/${REPO_LC}/manifests/${VERSION}" || true)"
          if [ "$CODE" = "200" ]; then
            echo "OK: ghcr.io/${REPO_LC}:${VERSION} is anonymously pullable." >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### :warning: GHCR package is not anonymously pullable (HTTP ${CODE})"
              echo
              echo "README's \`docker run ghcr.io/${REPO_LC}:latest\` will return an"
              echo "authorization error for everyone until this one-time step is done:"
              echo
              # MAN-65 remediate round 7, finding 3.D: derived rather than
              # hardcoded -- this repo has already been renamed once
              # (docs/DECISIONS/2026-09-01-rename-to-manta.md), and a
              # hardcoded name would 404 after the next rename or in a fork.
              echo "1. https://github.com/${IMAGE_PATH}/pkgs/container/${REPO_LC##*/}"
              echo "2. **Package settings** -> **Danger Zone** -> **Change visibility** -> **Public**"
              echo
              echo "See docs/RUNBOOKS/release.md. This is a deliberate human step (MAN-65 finding 4)."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning title=GHCR package not public::anonymous pull of ${REPO_LC}:${VERSION} returned ${CODE}; see the job summary"
          fi

  # MAN-244: package-write permission requires owner approval in both modes.
  # ghcr-test-publish permits any ref, preserving branch and tag test builds.
  docker-build-dispatch:
    needs: [validate-tag, build]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: ghcr-test-publish
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: inputs.publish
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ inputs.publish == true }}
          # `:latest` is reserved for real tag pushes only (`publish-latest`) --
          # a workflow_dispatch run with publish=true can target any branch, not
          # just a release, and README's `docker run ghcr.io/.../manta:latest`
          # install command must always trace to a real tagged release, not a
          # manual test build that happened to also push. The dispatch-<run_id>
          # tag `validate-tag` derives is still pushed on a dispatch publish, for
          # testing this job specifically -- just never `:latest`.
          tags: ${{ needs.validate-tag.outputs.image }}:${{ needs.validate-tag.outputs.version }}

      # Same probe as docker-publish-release's (MAN-65 finding 4) -- keep the
      # two in sync. Gated on the condition that gates this job's own push: a
      # publish=true test push can be the one that first creates the private
      # GHCR package.
      - name: Verify the image is anonymously pullable
        if: success() && inputs.publish == true
        env:
          IMAGE_PATH: ${{ github.repository }}
          VERSION: ${{ needs.validate-tag.outputs.version }}
        run: |
          set -uo pipefail
          REPO_LC="$(echo "$IMAGE_PATH" | tr '[:upper:]' '[:lower:]')"
          TOKEN="$(curl -fsSL "https://ghcr.io/token?scope=repository:${REPO_LC}:pull&service=ghcr.io" | jq -r .token || true)"
          CODE="$(curl -sSL -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${TOKEN:-}" \
            -H 'Accept: application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json' \
            "https://ghcr.io/v2/${REPO_LC}/manifests/${VERSION}" || true)"
          if [ "$CODE" = "200" ]; then
            echo "OK: ghcr.io/${REPO_LC}:${VERSION} is anonymously pullable." >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### :warning: GHCR package is not anonymously pullable (HTTP ${CODE})"
              echo
              echo "README's \`docker run ghcr.io/${REPO_LC}:latest\` will return an"
              echo "authorization error for everyone until this one-time step is done:"
              echo
              # MAN-65 remediate round 7, finding 3.D: derived rather than
              # hardcoded -- this repo has already been renamed once
              # (docs/DECISIONS/2026-09-01-rename-to-manta.md), and a
              # hardcoded name would 404 after the next rename or in a fork.
              echo "1. https://github.com/${IMAGE_PATH}/pkgs/container/${REPO_LC##*/}"
              echo "2. **Package settings** -> **Danger Zone** -> **Change visibility** -> **Public**"
              echo
              echo "See docs/RUNBOOKS/release.md. This is a deliberate human step (MAN-65 finding 4)."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning title=GHCR package not public::anonymous pull of ${REPO_LC}:${VERSION} returned ${CODE}; see the job summary"
          fi

  # MAN-65 finding 3. Two properties, both required:
  #
  # 1. Correctness must not depend on GitHub Actions' concurrency-group
  #    ordering. This job previously carried a repo-wide
  #    `concurrency: group: release-publish-latest` block, on the theory
  #    that "the only thing a cancellation can ever drop is a `:latest`
  #    write from a run that was about to decline it anyway" -- confirmed
  #    FALSE in review (remediate round 7, finding 3.A). GitHub cancels the
  #    previously PENDING run in a concurrency group whenever a new one
  #    arrives, regardless of `cancel-in-progress` -- that setting only
  #    protects the run already IN PROGRESS. Pending order is ARRIVAL
  #    order (this job's `needs: docker-publish-release`, so arrival order is
  #    build-completion order), not tag-version order: with three
  #    overlapping releases, the run for the actual newest tag can be the
  #    one sitting pending, cancelled by a release that is neither the
  #    newest nor the one still in progress -- and then `:latest` is never
  #    written for the newest release at all.
  #
  #    Fix: no concurrency group here, at all. Each run instead answers a
  #    GLOBAL question from a fresh `git fetch --tags` -- "what is the
  #    newest STABLE tag in the whole repo right now?" -- rather than "is
  #    MY tag newer than the specific run it happens to race against".
  #    Tag creation (`git push origin vX.Y.Z`) takes seconds, at the very
  #    START of a release, while this check runs AFTER the multi-arch
  #    build (minutes later); any tag genuinely "overlapping" this one is
  #    therefore already visible by the time either release reaches this
  #    step. Whichever run actually executes reaches the same, correct
  #    answer, independent of execution or completion order -- no run
  #    needs to "survive" anything for the outcome to be right.
  #
  # 2. A recency re-check performed AFTER the build, not at job start, then
  #    a manifest-only copy. `docker buildx imagetools create` re-points a
  #    tag at an already-pushed multi-arch manifest in seconds, so the
  #    window between "is this still newest?" and "wrote :latest" is
  #    seconds rather than the whole multi-arch build. Residual risk,
  #    accepted and recorded in
  #    docs/DECISIONS/2026-09-05-man65-release-pipeline-hardening.md: two
  #    tags pushed within that few-second window could still resolve out
  #    of order -- this is now the ONLY residual race (point 1 above
  #    removed the other one). Closing it completely would need an
  #    external lock or a reconciler workflow -- disproportionate for a
  #    project where one maintainer pushes one release tag at a time, and
  #    recoverable in one command (the runbook documents it).
  #
  # `release` below deliberately does NOT depend on this job: a declined
  # `:latest` write must never block a GitHub Release.
  publish-latest:
    needs: [validate-tag, docker-publish-release]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # MAN-244: retain owner approval and the same production tag-only policy.
    # This sequential job may prompt for approval again; do not remove its gate.
    environment: ghcr-publish
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Is this still the newest stable release?
        id: recency
        shell: bash
        run: |
          set -euo pipefail
          # Re-fetch HERE, after the build: tags fetched at checkout time
          # would answer a question that was current before the build ran,
          # which is the whole bug this job fixes. --prune-tags drops a local
          # tag deleted on the remote meanwhile (the bad-tag correction in
          # docs/RUNBOOKS/release.md); --prune alone only prunes branches.
          git fetch --tags --force --prune --prune-tags origin
          NEWEST="$(scripts/release-version.sh is-newest-stable "$GITHUB_REF_NAME")"
          echo "newest=$NEWEST" >> "$GITHUB_OUTPUT"
          echo "publish :latest: $NEWEST"
          if [ "$NEWEST" != "true" ]; then
            # MAN-65 remediate round, CR-1: this predicate decides recency
            # from git tags alone, not from confirmed GHCR publication (see
            # docs/DECISIONS/2026-09-05-man65-release-pipeline-hardening.md,
            # "a second deliberate asymmetry") -- so a decline here CAN be
            # wrong if the blocking tag's own release-publish run never
            # actually published an image. That must be visible in the
            # run's own summary, not buried in this step's log alone.
            {
              echo "### :warning: \`:latest\` was NOT updated for ${GITHUB_REF_NAME}"
              echo
              echo "A numerically newer (or equal) stable tag exists in the repo --"
              echo "see this step's log above for which one. If that tag's own"
              echo "release-publish run never actually published an image, :latest"
              echo "is now stale; recovery is documented in docs/RUNBOOKS/release.md."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning title=:latest not updated::${GITHUB_REF_NAME} was not published as :latest -- see the job summary and this step's log"
          fi

      - name: Log in to GHCR
        if: steps.recency.outputs.newest == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Point :latest at this release
        if: steps.recency.outputs.newest == 'true'
        env:
          IMAGE: ${{ needs.validate-tag.outputs.image }}
          VERSION: ${{ needs.validate-tag.outputs.version }}
        run: docker buildx imagetools create -t "$IMAGE:latest" "$IMAGE:$VERSION"

  # MAN-80: every Release carries a SHA256SUMS asset and a SLSA build-provenance
  # attestation over the same five archives, so an operator can check a download
  # with `sha256sum -c` and `gh attestation verify` (docs/RUNBOOKS/release.md,
  # "Verifying a downloaded release"). Signing happens HERE, not in `build`: the
  # build legs run dependency build scripts and `cross` containers, and keeping
  # id-token: write out of them limits who can mint a signing token. See
  # docs/DECISIONS/2026-10-10-man80-release-checksums-attestation.md.
  #
  # MAN-298: the Release does not wait for the image. It shares docker-publish-release's
  # owner approval (ghcr-publish) but not its outcome, so a failed or re-run image publish
  # neither skips nor repeats it. A rejected approval still publishes nothing.
  # See docs/DECISIONS/2026-10-11-man298-first-release.md.
  release:
    needs: [validate-tag, build]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: ghcr-publish
    # id-token + attestations: the Sigstore signing certificate and the attestation
    # upload. No artifact-metadata: write -- storage records are a push-to-registry
    # feature, and this job pushes nothing to a registry.
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      # Only the build legs' `manta-*` artifacts: docker/build-push-action also uploads a
      # `*.dockerbuild` build record to this run, which must not be checksummed, attested or
      # published as a release asset.
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          pattern: manta-*
          path: dist
          merge-multiple: true

      - name: List downloaded artifacts
        run: find dist -type f

      # Run inside dist/ so the file lists bare archive names: `sha256sum -c` in an
      # operator's download folder finds nothing to verify against `dist/...` paths.
      # The glob expands before the redirect creates SHA256SUMS, so it never lists
      # itself; an empty dist/ fails the step on the literal '*'.
      - name: Write SHA256SUMS
        shell: bash
        working-directory: dist
        run: |
          set -euo pipefail
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      # Fail closed: attest BEFORE the Release exists, so a failed attestation leaves
      # no Release rather than one operators cannot verify. Recovery is re-running
      # this job. The subjects are the digests SHA256SUMS lists, so the published
      # file is the single source of both checks.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS

      # Read only the version helper from this release's reviewed commit. Keep the
      # checkout separate so its clean step cannot remove the downloaded archives.
      # No builds or dependency scripts run in the signing job.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: release-source
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout: scripts/release-version.sh
          sparse-checkout-cone-mode: false

      # Decide after builds, approval and attestation, immediately before publishing.
      # Refresh tags even after checkout so an overlapping release can block promotion.
      - name: May this Release become Latest?
        id: latest
        shell: bash
        working-directory: release-source
        run: |
          set -euo pipefail
          git fetch --tags --force --prune --prune-tags origin
          LATEST="$(scripts/release-version.sh is-newest-stable "$GITHUB_REF_NAME")"
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"

      # `files: dist/*` picks up SHA256SUMS alongside the archives. GitHub prepends `body`
      # to the generated notes. MAN-298 / decision D7: keep the label until manta clears its
      # M2/M3 acceptance gates. A SemVer pre-release tag (`v0.2.0-rc.1`) is a GitHub
      # pre-release, so releases/latest -- README's download links -- never serves one, and
      # only the newest stable tag observed by the check above becomes Latest.
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ steps.latest.outputs.latest }}
          generate_release_notes: true
          body: |
            > **Pre-stability alpha, expect breakage.** manta has not cleared its own
            > M2/M3 acceptance gates. Command-line flags, configuration keys and output
            > formats can change between releases before 1.0.

            Download the archive for your platform and `SHA256SUMS`, and check both
            before running anything:
            [Verifying a downloaded release](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/docs/RUNBOOKS/release.md#verifying-a-downloaded-release).
            Linux binaries need the ALSA runtime library (`libasound2`).
