[workspace]
resolver = "2"
members = [
    "crates/skimmer-decode",
    "crates/skimmer-dsp",
    "crates/skimmer-input",
    "crates/skimmer-testkit",
    "crates/skimmer-engine",
    "crates/skimmer-spot",
    "crates/skimmer-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.85.0"
repository = "https://github.com/HagaleTechnologies/skimmer"

[workspace.dependencies]
skimmer-decode = { path = "crates/skimmer-decode" }
skimmer-dsp = { path = "crates/skimmer-dsp" }
skimmer-input = { path = "crates/skimmer-input" }
skimmer-testkit = { path = "crates/skimmer-testkit" }
skimmer-engine = { path = "crates/skimmer-engine" }
skimmer-spot = { path = "crates/skimmer-spot" }

coppa-dsp = { git = "https://github.com/HagaleTechnologies/coppa.git", rev = "f8a4d16df7e5776a0756943c05712038774e6c70" }
coppa-audio = { git = "https://github.com/HagaleTechnologies/coppa.git", rev = "f8a4d16df7e5776a0756943c05712038774e6c70" }
coppa-channel = { git = "https://github.com/HagaleTechnologies/coppa.git", rev = "f8a4d16df7e5776a0756943c05712038774e6c70" }

cpal = "0.18"
ctrlc = "3"
libc = "0.2"

anyhow = "1.0"
num-complex = "0.4"
hound = "3.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
criterion = "0.8"
rand_core = "0.10"
rand_chacha = "0.10"
proptest = "1.5"
approx = "0.5"
tempfile = "3"
rayon = "1"
tungstenite = "0.30"
rubato = "4.0"
soapysdr = "0.5"
regex = "1"

# DSP in debug tests is unusably slow without this; golden V1 runs in seconds.
[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 2
