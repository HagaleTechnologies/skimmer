[package]
name = "manta-cli"
description = "manta daemon and CLI"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[[bin]]
name = "manta"
path = "src/main.rs"

[features]
soapy = ["manta-input/soapy"]
hpsdr = ["manta-input/hpsdr"]

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
# MAN-126: `manta doctor`'s audio check lists sound-card inputs.
coppa-audio = { workspace = true }
ctrlc = { workspace = true }
hound = { workspace = true }
serde_json = { workspace = true }
manta-decode = { workspace = true }
manta-engine = { workspace = true }
manta-input = { workspace = true }
manta-server = { workspace = true }
num-complex = { workspace = true }
serde = { workspace = true }
manta-spot = { workspace = true }
manta-testkit = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "net", "time", "io-util", "macros"] }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# MAN-126: `manta doctor`'s clock check reads the kernel's NTP-sync state
# with `adjtimex`, which only Linux has.
[target.'cfg(target_os = "linux")'.dependencies]
libc = { workspace = true }

[dev-dependencies]
coppa-audio = { workspace = true }
libc = { workspace = true }
serde_json = { workspace = true }
manta-dsp = { workspace = true }
manta-testkit = { workspace = true }
tempfile = { workspace = true }
hound = { workspace = true }
regex = { workspace = true }
sha2 = { workspace = true }
tungstenite = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
# MAN-268: tests/packaging_examples.rs parses the shipped docker-compose.yml
# as YAML rather than matching text fragments. Test-only; pinned here, not
# in [workspace.dependencies], because no other crate reads YAML.
serde_yaml_ng = "0.10"
